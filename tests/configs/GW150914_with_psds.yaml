event:
  name: GW150914
  fiducial parameters:
    chirp mass: 30
    
waveform:
  approximant: IMRPhenomXPHM

sampler:
  live points: 1000

likelihood:
  marginalisation:
    - distance

prior:
  class: MarginalizedDistanceIASPrior
  distributions:
    chirp mass:
      minimum: 10
      maximum: 40

# Optional: Specify PSD files for each interferometer
# PSDs should be in two-column format: frequency (Hz), PSD value
# These can be generated by other tools like BayesWave
psds:
  H1: /path/to/H1_psd.txt
  L1: /path/to/L1_psd.txt
  
