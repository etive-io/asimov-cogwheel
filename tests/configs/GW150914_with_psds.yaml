event:
  name: GW150914
  fiducial parameters:
    chirp mass: 30
    
waveform:
  approximant: IMRPhenomXPHM

sampler:
  live points: 1000

likelihood:
  marginalisation:
    - distance

prior:
  class: MarginalizedDistanceIASPrior
  distributions:
    chirp mass:
      minimum: 10
      maximum: 40

# Optional: Specify PSD files for each interferometer
# PSDs should be in two-column format: frequency (Hz), PSD value
# These can be generated by other tools like BayesWave
psds:
  H1: REPLACE_WITH_ACTUAL_H1_PSD_PATH  # Example placeholder path
  L1: REPLACE_WITH_ACTUAL_L1_PSD_PATH  # Example placeholder path
  # Optional: Configure whitening filter parameters
  whitening_filter:
    fmin: 15.0       # Minimum frequency (Hz), default: 15.0
    df_taper: 1.0    # Taper width (Hz), default: 1.0
  
